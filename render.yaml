services:
  - type: web
    name: vatel-smart-canteen
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && if [ -n "$DEMO_PASSWORD" ]; then python manage.py seed_demo; fi
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.2"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vatel-smart-canteen-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "vatel-smart-canteen.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://vatel-smart-canteen.onrender.com"
      - key: DEMO_PASSWORD
        sync: false
      - key: TIME_ZONE
        value: "Africa/Abidjan"
      - key: RESERVATION_CUTOFF_HOUR
        value: "18"
      - key: LOW_BALANCE_THRESHOLD
        value: "2000"
      - key: WALLET_MAX_BALANCE
        value: "100000"
      - key: TOPUP_AMOUNTS
        value: "1000,2000,5000,10000,20000"
      - key: ANNUAL_PASS_PRICE
        value: "180000"
      - key: SCHOOL_YEAR_LABEL
        value: "2026-2027"
      - key: SCHOOL_YEAR_START
        value: "2026-09-01"
      - key: SCHOOL_YEAR_END
        value: "2027-06-30"
      - key: PICKUP_PAYMENT_ENABLED
        value: "True"
      - key: MAX_EXTRA_PORTIONS
        value: "1"
      - key: DELIVERY_ENABLED
        value: "True"
      - key: DELIVERY_FEE
        value: "500"
      - key: DEFAULT_DEBIT_FREQUENCY
        value: "DAILY"
      - key: MAX_UNPAID_RESERVATIONS
        value: "2"

databases:
  - name: vatel-smart-canteen-db
    databaseName: vatel_smart_canteen
    user: vatel_user
    plan: free
